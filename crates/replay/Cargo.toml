[package]
name = "pi_cmd_replay"
version = "0.1.0"
authors = ["suncy <suncy@gmail.com>"]
edition = "2021"

[features]
default = ["pi_js_export", "wasm_bindgen", "replay", "pi_export_base/spector", "pi_export_base/replay","pi_ui_render/debug"]
pi_js_export = []
wasm_bindgen = ["pi_export_assets_mgr/wasm_bindgen"]
allow_not_run = []
replay 			        = []
# system_graph = [] # 提供接口，返回system的日程图

[dependencies]
env_logger          = "0.9"
brotli-decompressor = "5.0"
nalgebra = { version = "0.32", features = ["serde", "serde-serialize"] }
pi_async_httpc = {version="0.6"}
pi_ws = {version="0.6", optional=true}
pi_tcp = {version="0.5", optional=true}
json = {version="0.12", optional=true}
lazy_static = "1.5"
pi_export_assets_mgr = {version = "0.1", registry = "yn", path = "../assets_mgr"}
pi_export_base = { path = "../base"}
console_log = "1.0"
crossbeam-channel = "0.5"
paste = "1.0"
pi_atom = "0.6"
pi_hash="0.1"
log = "0.4"
serde_json = "1.0"
serde                   = { version = "1.0", features = ["derive"] }
derive-deref-rs = "0.1"
smallvec                = "1.9"
pi_export_macro = {path="../macro"}
pi_share = {version="0.5"}
pi_assets = "0.15"
pi_hal = {version = "0.3", registry = "yn"}
render_core = {version = "0.3", registry = "yn"}
pi_time = {version = "0.5", features = ["high_performance"]}
bevy_window = { version = "0.3", registry = "yn", package = "pi_bevy_window" }
# bevy_ecs = "0.11"
# bevy_app = {version = "0.11", default_features = false}
# bevy_a11y = "0.11"
# bevy_window = {version = "0.1", registry = "yn", package = "pi_bevy_window" }
postcard = {version = "1.0", features = ["use-std"]}
pi_flex_layout = "0.4"
pi_spatial = "0.6"
pi_slotmap              = "0.2"
pi_null = "0.1"
pi_world = "0.2"
pi_bevy_asset = {version = "0.3", registry = "yn"}
pi_bevy_render_plugin = {version = "0.3", registry = "yn"}
pi_bevy_winit_window = {version = "0.3", registry = "yn"}
pi_bevy_post_process = {version = "0.3", registry = "yn"}
pi_bevy_ecs_extend  = { version = "0.3", registry = "yn" }
pi_window_renderer = {version = "0.3", registry = "yn"}
pi_bevy_log = {version = "0.2", registry = "yn", features = ["log-file"]}
pi_render = {version = "0.3", registry = "yn"}
pi-async-rt = {version = "0.2"}
js_proxy_gen_macro = { registry = "yn", version = "0.2" }
tracing-subscriber = "0.3"
# bevy_mod_debugdump = "0.8"
wgpu = {version = "0.3", registry = "yn", package="pi_wgpu"}
tracing = "0.1"
# tracing-tracy = "0.11"
pi_winit = {version = "0.28", registry="yn", package="winit"}
backtrace = "0.3"
pi_ui_render = {version = "0.2", registry = "yn", features = ["debug", "devtools", "single_thread"]}
pi_style = {version = "0.3", registry = "yn"}
pi_3d 		            = { version = "1.3.*", registry = "yn" }
pi_scene_shell 		    = { version = "1.3.*", registry = "yn" }
pi_node_materials 		= { version = "1.3.*", registry = "yn" }
pi_scene_context 		= { version = "1.3.*", registry = "yn" }
pi_mesh_builder 		= { version = "1.3.*", registry = "yn" }
pi_gltf2_load           = { version = "1.3.*", registry = "yn" }
pi_particle_system      = { version = "1.3.*", registry = "yn" }
pi_trail_renderer       = { version = "1.3.*", registry = "yn" }
pi_scene_math           = { version = "0.0.*", registry = "yn" }
pi_animation            = { version = "0.2", registry = "yn" }
pi_curves               = { version = "0.1", registry = "yn" }

[patch.yn]
# pi_hal  = { path = "../../../pi_hal" }
# pi_wgpu = { path = "../../../pi_wgpu" }
# pi_glow = {path = "../pi_glow"}
# pi_wgpu = { path = "../pi_wgpu" }
# pi_bon_decode = {path = "../pi_bon_decode"}
# pi_egl = {path = "../pi_egl"}
# winit = {path = "../winit"}

# pi_render
pi_render               = { version = "0.3", registry = "yn", path = "../../../pi_render" }
render_utils            = { version = "0.2", registry = "yn", path = "../../../pi_render/crates/render_utils" }
render_core             = { version = "0.3", registry = "yn", path = "../../../pi_render/crates/render_core" }
render_derive           = { version = "0.2", registry = "yn", path = "../../../pi_render/crates/render_derive" }
render_compile          = { version = "0.3", registry = "yn", path = "../../../pi_render/crates/render_compile" }

# pi_bevy
pi_bevy_ecs_extend 		= { version = "0.3", path = "../../../pi_bevy/crates/ecs_extend" }
pi_bevy_render_plugin 	= { version = "0.3", path = "../../../pi_bevy/crates/render" }
pi_bevy_asset 			= { version = "0.3", path = "../../../pi_bevy/crates/asset" }
pi_bevy_winit_window	= { version = "0.3", path = "../../../pi_bevy/crates/winit_window" }
pi_bevy_log 			= { version = "0.3", path = "../../../pi_bevy/crates/log" }
pi_bevy_ecs_macro 		= { version = "0.3", path = "../../../pi_bevy/crates/ecs_extend/macro" }
pi_bevy_post_process	= { version = "0.3", path = "../../../pi_bevy/crates/post_process" }
pi_bevy_window 			= { version = "0.3", path = "../../../pi_bevy/crates/window" }
pi_window_renderer 		= { version = "0.3", path = "../../../pi_bevy/crates/window_renderer" }
pi_ui_render        	= { version = "0.2", path = "../../../pi_ui_render", features = ["debug"]}
pi_3d               	= { version = "0.3", path = "../../../pi_3d_n" }
pi_node_materials   	= { version = "0.3", path = "../../../pi_3d_n/crates/node_materials" }
pi_scene_context    	= { version = "0.3", path = "../../../pi_3d_n/crates/pi_scene_context" }
unlit_material      	= { version = "0.3", path = "../../../pi_3d_n/crates/unlit_material" }
pi_mesh_builder     	= { version = "0.3", path = "../../../pi_3d_n/crates/pi_mesh_builder" }
pi_trail_renderer   	= { version = "0.3", path = "../../../pi_3d_n/crates/trail" }
pi_gltf2_load       	= { version = "0.3", path = "../../../pi_3d_n/crates/gltf2" }
pi_particle_system  	= { version = "0.3", path = "../../../pi_3d_n/crates/particle_system" }
pi_scene_shell      	= { version = "0.3", path = "../../../pi_3d_n/crates/pi_scene_shell" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"]}
js-sys = "0.3"
# 固定在0.3.67， 是因为0.3.68版本接口更改， 无法适配wgpu 0.19
web-sys = {version="=0.3.77", features = [
	"HtmlCanvasElement"
]}
wgpu1 = { version = "25.0.*", package = "wgpu", default-features = false, features = ["glsl", "webgl", "fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu1 = { version = "25.0.*", package = "wgpu", default-features = false, features = ["glsl"] }

