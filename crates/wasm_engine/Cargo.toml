[package]
name = "pi_wasm_engine"
version = "0.1.0"
authors = ["suncy <suncy@yineng.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pi_js_export"]
const_memory = []
release = ["log/release_max_level_warn", "tracing/release_max_level_off"]
trace = ["log/release_max_level_info", "tracing/release_max_level_info", "pi_bevy_log/tracing-chrome", "pi_bevy_render_plugin/trace", "pi_world/trace"]
pi_js_export = []

[dependencies]
pi_hal = {version = "0.3", registry = "yn"}
# pi_atom = {version = "0.6"}
# pi_arr = { version = "=0.20", features = ["rc"]}
pi_sdf = {version = "0.1", registry = "yn"}
async-executor = "=1.6.0" #1.7.1bug
pi_export_gui = { path = "../gui", default-features=false, features=["record"] }
pi_export_task_pool = { path = "../task_pool" }
# pi_export_astar = { path = "../astar"}
# pi_export_base = { path = "../base", features = ["allow_not_run"]}
pi_export_base = { path = "../base"}
pi_export_assets_mgr = { path = "../assets_mgr" }
# pi_export_quad_tree = { path = "../quad_tree"}
scene3d_export = { path = "../scene3d" }
pi_web_logger = {git = "http://ser.yinengyun.com:10082/tech/pi_web_logger.git"}
pi_share = "0.5"
talc = {version="=4.4.0", features = ["counters"]}
wasm-bindgen = { version = "0.2" }
# bevy_ecs = "0.11"
# bevy_app = "0.11"
# pi_world = {version = "0.2"}
pi_world = {version = "0.2", features = ["rc"]}
pi_winit = {version = "0.28", registry="yn", package="winit"}
pi_export_cache = { path = "../cache"}

# naga = { path = "../../../wgpu/naga", features=["glsl-in", "wgsl-in", "spv-in", "compact"] }
# wgpu = { path = "../../../wgpu/wgpu" }

log = "0.4"
tracing = "0.1"

# pi_key_alloter = "=0.6.1"

# 添加webgl feature
# wgpu1 = { version = "0.19", package = "wgpu", default-features = false, features = ["glsl", "webgl"] }
pi_render = { version = "0.3", registry = "yn", features=["webgl"] }
pi_bevy_winit_window = {version = "0.3", registry = "yn"}
pi_bevy_render_plugin = { version = "0.3", registry = "yn", features=["webgl"]}
pi_bevy_log = {version = "0.2", registry = "yn"}
# pi_wgpu =  { path = "../../../pi_wgpu" }
# pi_wgpu =  {version = "0.3", registry = "yn", features = ["single_thread", "use_wgpu"]}
pi_spatial = "0.6"
pi_path_finding = "0.6"
pi_orca = "0.5"

getrandom = { version = "0.3", features = ["wasm_js"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
pi_bon_decode = { version = "0.2", registry = "yn"}
pi-async-rt = {version = "0.2", features = ["serial"]}
uuid = { version = "1", features = ["js"] }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"]}
js-sys = "0.3"
# 固定在0.3.67， 是因为0.3.68版本接口更改， 无法适配wgpu 0.19
web-sys = {version="=0.3.77", features = [
	"HtmlCanvasElement"
]}
wgpu1 = { version = "25.0.*", package = "wgpu", default-features = false, features = ["glsl", "webgl", "fragile-send-sync-non-atomic-wasm"] }


# [profile.release]
